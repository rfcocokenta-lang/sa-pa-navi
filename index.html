<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101e"><title>SA・PAナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><div><p class="eyebrow">HIGHWAY ASSIST</p><h1>SA・PAナビ</h1></div><button id="locateBtn" class="icon-btn">⌖</button></header>
<section class="card"><label for="destination">目的地</label><div class="destination-row"><input id="destination" placeholder="例：東京駅"><button id="searchBtn">ルート検索</button></div><p id="status" class="status">現在地を取得しています…</p></section>
<div id="map"></div>
<section id="summary" class="summary hidden"><div><span>目的地まで</span><strong id="totalDistance">--</strong></div><div><span>到着予定</span><strong id="eta">--:--</strong></div><div><span>残り時間</span><strong id="remainingTime">--</strong></div></section>
<section><div class="section-title"><h2>ルート上のSA・PA</h2><span id="count">0か所</span></div><div id="spots" class="spots"><div class="empty">目的地を入力して検索してください。</div></div></section>
<section class="card note"><strong>実GPS版 v0.4</strong><p>GPS、OpenStreetMap、OSRM、Overpassを利用する試作版です。公開APIには利用制限があるため、実運用では専用APIへの切り替えを推奨します。</p></section>
<footer>SA・PAナビ Prototype v0.4</footer></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
