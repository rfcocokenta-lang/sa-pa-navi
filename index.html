<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>SA・PAナビ プロトタイプ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">HIGHWAY ASSIST</p>
        <h1>SA・PAナビ</h1>
      </div>
      <button id="locateBtn" class="icon-btn" aria-label="現在地を取得">⌖</button>
    </header>

    <section class="card route-card">
      <label for="destination">目的地</label>
      <div class="destination-row">
        <input id="destination" type="text" placeholder="例：東京駅">
        <button id="searchBtn">検索</button>
      </div>
      <p id="status" class="status">現在地を取得するとルート案内を開始できます。</p>
    </section>

    <section id="summary" class="summary hidden">
      <div><span>目的地まで</span><strong id="totalDistance">--</strong></div>
      <div><span>到着予定</span><strong id="eta">--:--</strong></div>
      <div><span>残り時間</span><strong id="remainingTime">--</strong></div>
    </section>

    <section>
      <div class="section-title">
        <h2>途中のSA・PA</h2>
        <span id="count">0か所</span>
      </div>
      <div id="spots" class="spots">
        <div class="empty">目的地を入力して「検索」を押してください。</div>
      </div>
    </section>

    <section class="card note">
      <strong>プロトタイプについて</strong>
      <p>現在はサンプルの高速道路ルートとSA・PAデータで動作します。実運用では地図・ルートAPIとSA/PAデータを接続します。</p>
    </section>

    <footer>SA・PAナビ Prototype v0.1</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
